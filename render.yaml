services:
  - type: web
    name: jlcoding
    runtime: node
    plan: free
    region: singapore
    rootDir: jlcoding
    # 构建：依赖 → prisma client → 平台构建 SHA → schema 同步（幂等；free 层不支持 Pre-Deploy，故放构建内）→ next build
    buildCommand: npm install && npx prisma generate && node scripts/build-info.mjs && npx prisma db push --schema prisma/schema.prisma --skip-generate && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: OPENCODE_API_KEY
        sync: false
      - key: OPENCODE_BASE_URL
        value: https://opencode.ai/zen/v1
